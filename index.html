<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaddBot Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 16px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #334155; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
        .user { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-top: 6px; background-color: #1e293b; border: 1px solid #475569; color: #38bdf8; border-radius: 6px; cursor: pointer; text-decoration: none; }
        .option-btn:hover { background-color: #0f172a; }
        #input-container { display: flex; padding: 12px; background-color: #1e293b; gap: 8px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>RaddBot - Buscador</header>
    <div id="chat-container">
        <div class="message bot">¡Hola! Escribe el nombre del contenido que deseas buscar.</div>
    </div>
    <div id="input-container">
        <input type="text" id="query-input" placeholder="Buscar..." onkeypress="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Buscar</button>
    </div>

    <script>
        const BACKEND_URL = "https://raddbot-backend.onrender.com";

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerHTML = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            input.value = '';
            appendMessage("Buscando...", 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                
                const container = document.getElementById('chat-container');
                container.removeChild(container.lastChild); // Remover "Buscando..."

                if (!data.results || data.results.length === 0) {
                    appendMessage("No se encontraron resultados.", 'bot');
                    return;
                }

                let html = `Resultados para <b>${query}</b>:<br>`;
                data.results.forEach((item, index) => {
                    const downloadUrl = `${BACKEND_URL}/api/download?query=${encodeURIComponent(query)}&option=${index + 1}`;
                    html += `<a class="option-btn" href="${downloadUrl}" target="_blank">📥 ${index + 1}. ${item}</a>`;
                });

                appendMessage(html, 'bot');
            } catch (err) {
                const container = document.getElementById('chat-container');
                container.removeChild(container.lastChild);
                appendMessage("Error conectando con el servidor.", 'bot');
            }
        }
    </script>
</body>
</html>
