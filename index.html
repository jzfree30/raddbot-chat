<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADDCRAFT - Buscador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: #050b14; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-wrapper {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        header { 
            background-color: rgba(15, 23, 42, 0.9); 
            padding: 16px; 
            text-align: center; 
            font-weight: bold; 
            color: #38bdf8; 
            border-bottom: 2px solid #2563eb; 
            font-size: 1.2rem;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            background-image: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.65)), url('https://i.ibb.co/DhpDhyZ/images.jpg'); 
            background-size: cover; 
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        .message { 
            max-width: 88%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            line-height: 1.4; 
            word-break: break-word; 
            backdrop-filter: blur(6px);
        }
        
        .user { 
            align-self: flex-end; 
            background-color: rgba(37, 99, 235, 0.88); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .bot { 
            align-self: flex-start; 
            background-color: rgba(30, 41, 59, 0.88); 
            color: #f8fafc; 
            width: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .option-btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: rgba(15, 23, 42, 0.85); 
            border: 1px solid #38bdf8; 
            color: #38bdf8; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: background 0.2s;
        }
        
        .option-btn:hover { 
            background-color: rgba(56, 189, 248, 0.2); 
        }

        .status-card { 
            margin-top: 8px; 
            padding: 12px; 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid #38bdf8; 
            border-radius: 8px; 
            color: #38bdf8; 
            font-size: 0.9rem; 
            text-align: center; 
        }

        #input-container { 
            display: flex; 
            padding: 12px; 
            background-color: rgba(15, 23, 42, 0.95); 
            gap: 8px; 
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background-color: #0f172a; 
            color: white; 
            outline: none; 
            font-size: 1rem; 
        }

        input:focus { border-color: #38bdf8; }

        button.send-btn { 
            padding: 12px 20px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        button.send-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <header>RADDCRAFT</header>
        
        <div id="chat-container">
            <div class="message bot">¡Hola! Escribe el nombre del addon, skin o mundo que deseas buscar.</div>
        </div>

        <div id="input-container">
            <input type="text" id="query-input" placeholder="Buscar en RADDCRAFT..." onkeypress="if(event.key==='Enter') sendQuery()">
            <button class="send-btn" onclick="sendQuery()">Buscar</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://raddbot-backend.onrender.com";

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerHTML = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return msg;
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            input.value = '';
            const loadingMsg = appendMessage("Buscando en catálogo...", 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                loadingMsg.remove();

                if (!data.results || data.results.length === 0) {
                    appendMessage("No se encontraron resultados.", 'bot');
                    return;
                }

                let html = `Resultados para <b>${query}</b>:<br>`;
                data.results.forEach((item, index) => {
                    html += `<button class="option-btn" onclick="requestDownload('${encodeURIComponent(query)}', ${index + 1})">📥 ${item}</button>`;
                });
                appendMessage(html, 'bot');
            } catch (err) {
                loadingMsg.remove();
                appendMessage("Error al conectar con el servidor.", 'bot');
            }
        }

        async function requestDownload(query, option) {
            const statusMsg = appendMessage(`<div class="status-card">⏳ Preparando el archivo en el servidor... Esto puede tomar un par de minutos si es muy pesado.</div>`, 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/start_download?query=${query}&option=${option}`);
                const data = await res.json();

                if (data.success) {
                    checkStatus(data.task_id, statusMsg);
                } else {
                    statusMsg.innerHTML = "❌ Error al iniciar el proceso de descarga.";
                }
            } catch (err) {
                statusMsg.innerHTML = "❌ Error de conexión con el servidor.";
            }
        }

        function checkStatus(taskId, statusMsg) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${BACKEND_URL}/api/check_status?task_id=${taskId}`);
                    const data = await res.json();

                    if (data.status === "completed") {
                        clearInterval(interval);
                        statusMsg.innerHTML = `✅ ¡Archivo listo!<br><br><a href="${data.download_url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline; font-size: 1.1rem;">👉 Toca aquí para descargar archivo (.mcworld / .mcaddon)</a>`;
                    } else if (data.status === "error") {
                        clearInterval(interval);
                        statusMsg.innerHTML = "❌ No se pudo procesar este archivo.";
                    }
                } catch (e) {
                    // Reintento silencioso
                }
            }, 4000);
        }
    </script>
</body>
</html>
