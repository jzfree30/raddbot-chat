<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADDCRAFT - Buscador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 18px; text-align: center; font-weight: bold; color: #38bdf8; border-bottom: 2px solid #2563eb; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
        .user { align-self: flex-end; background-color: #2563eb; color: white; }
        .bot { align-self: flex-start; background-color: #334155; color: #f8fafc; width: 100%; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 10px; margin-top: 8px; background-color: #1e293b; border: 1px solid #475569; color: #38bdf8; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status-card { margin-top: 8px; padding: 10px; background: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; color: #38bdf8; font-size: 0.9rem; text-align: center; }
        #input-container { display: flex; padding: 12px; background-color: #1e293b; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>RADDCRAFT</header>
    <div id="chat-container">
        <div class="message bot">¡Hola! Escribe el nombre del addon o mundo que deseas buscar.</div>
    </div>

    <div id="input-container">
        <input type="text" id="query-input" placeholder="Buscar en RADDCRAFT..." onkeypress="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Buscar</button>
    </div>

    <script>
        const BACKEND_URL = "https://raddbot-backend.onrender.com";

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerHTML = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return msg;
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            input.value = '';
            const loadingMsg = appendMessage("Buscando en catálogo...", 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                loadingMsg.remove();

                if (!data.results || data.results.length === 0) {
                    appendMessage("No se encontraron resultados.", 'bot');
                    return;
                }

                let html = `Resultados para <b>${query}</b>:<br>`;
                data.results.forEach((item, index) => {
                    html += `<button class="option-btn" onclick="requestDownload('${encodeURIComponent(query)}', ${index + 1})">📥 ${item}</button>`;
                });
                appendMessage(html, 'bot');
            } catch (err) {
                loadingMsg.remove();
                appendMessage("Error al conectar con el servidor.", 'bot');
            }
        }

        async function requestDownload(query, option) {
            const statusMsg = appendMessage(`<div class="status-card">⏳ Preparando la descarga... Esto puede tardar unos minutos si el mundo es muy pesado (300MB+).</div>`, 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/start_download?query=${query}&option=${option}`);
                const data = await res.json();

                if (data.success) {
                    checkStatus(data.task_id, statusMsg);
                } else {
                    statusMsg.innerHTML = "❌ Error iniciando la descarga.";
                }
            } catch (err) {
                statusMsg.innerHTML = "❌ Error de conexión.";
            }
        }

        function checkStatus(taskId, statusMsg) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${BACKEND_URL}/api/check_status?task_id=${taskId}`);
                    const data = await res.json();

                    if (data.status === "completed") {
                        clearInterval(interval);
                        statusMsg.innerHTML = `✅ ¡Archivo listo!<br><br><a href="${data.download_url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline; font-size: 1.1rem;">👉 Toca aquí para descargar archivo (.mcworld / .mcaddon)</a>`;
                    } else if (data.status === "error") {
                        clearInterval(interval);
                        statusMsg.innerHTML = "❌ Error al procesar el archivo pesado.";
                    }
                } catch (e) {
                    // Reintentar en la siguiente iteración
                }
            }, 4000); // Revisa cada 4 segundos
        }
    </script>
</body>
</html>
