<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADDCRAFT - Buscador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 18px; text-align: center; font-weight: 800; font-size: 1.4rem; letter-spacing: 2px; color: #38bdf8; border-bottom: 2px solid #2563eb; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
        .user { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 2px; width: 100%; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 10px 14px; margin-top: 8px; background-color: #1e293b; border: 1px solid #475569; color: #38bdf8; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; }
        .option-btn:hover { background-color: #0f172a; border-color: #38bdf8; }

        .progress-box { margin-top: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 10px; display: none; }
        .progress-text { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-align: center; }

        #input-container { display: flex; padding: 12px; background-color: #1e293b; gap: 8px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>RADDCRAFT</header>
    <div id="chat-container">
        <div class="message bot">¡Hola! Escribe el nombre del addon o mundo que deseas buscar.</div>
    </div>

    <div id="status-box" class="progress-box" style="margin: 0 12px 12px 12px;">
        <div id="status-text" class="progress-text">Obteniendo enlace directo de descarga...</div>
    </div>

    <div id="input-container">
        <input type="text" id="query-input" placeholder="Buscar en RADDCRAFT..." onkeypress="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Buscar</button>
    </div>

    <script>
        const BACKEND_URL = "https://raddbot-backend.onrender.com";

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerHTML = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            input.value = '';
            appendMessage("Buscando en catálogo...", 'bot');

            try {
                const res = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                
                const container = document.getElementById('chat-container');
                container.removeChild(container.lastChild);

                if (!data.results || data.results.length === 0) {
                    appendMessage("No se encontraron resultados.", 'bot');
                    return;
                }

                let html = `Resultados para <b>${query}</b>:<br>`;
                data.results.forEach((item, index) => {
                    html += `<button class="option-btn" onclick="fetchDirectLink('${encodeURIComponent(query)}', ${index + 1})">📥 ${item}</button>`;
                });

                appendMessage(html, 'bot');
            } catch (err) {
                const container = document.getElementById('chat-container');
                container.removeChild(container.lastChild);
                appendMessage("Error conectando con el servidor.", 'bot');
            }
        }

        async function fetchDirectLink(query, option) {
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');

            statusBox.style.display = 'block';
            statusText.innerText = "Obteniendo enlace directo RADDCRAFT...";

            try {
                const res = await fetch(`${BACKEND_URL}/api/get_link?query=${query}&option=${option}`);
                const data = await res.json();

                if (data.success && data.download_url) {
                    statusText.innerText = "¡Enlace listo! Haz clic abajo para descargar:";
                    
                    // Mostrar un enlace directo y funcional para navegadores móviles
                    appendMessage(`✅ Enlace listo: <a href="${data.download_url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline;">👉 Toca aquí para descargar</a>`, 'bot');
                    
                    setTimeout(() => { statusBox.style.display = 'none'; }, 3000);
                } else {
                    statusText.innerText = "No se pudo extraer el enlace directo.";
                    setTimeout(() => { statusBox.style.display = 'none'; }, 4000);
                }
            } catch (err) {
                statusText.innerText = "Error obteniendo el enlace.";
                setTimeout(() => { statusBox.style.display = 'none'; }, 4000);
            }
        }
    </script>
</body>
</html>
